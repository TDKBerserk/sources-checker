name: Check sources links

on:
  workflow_dispatch: {}        # запуск вручную кнопкой "Run workflow"
  schedule:
    - cron: "0 3 * * *"        # каждый день в 03:00 UTC — при желании поменяй/убери

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install aiohttp

      - name: Run link checker
        run: python check_links.py sources_dedup.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: |
            alive.txt
            dead.txt
            report.txt

      - name: Replace sources.txt with alive links only
        run: cp alive.txt sources.txt

      - name: Commit updated sources.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.txt
          git diff --cached --quiet || git commit -m "auto: обновление sources.txt по итогам проверки ссылок"
          git push
