name: Check servers (real tunnel, INCY-style)

on:
  workflow_dispatch: {}
  push:
    paths:
      - "sources/**"
      - "sources.txt"
  schedule:
    - cron: "0 */6 * * *"   # раз в 6 часов — поменяй/убери по вкусу

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Install sing-box
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | cut -d '"' -f4)
          VERSION=${LATEST_TAG#v}
          curl -Lo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${LATEST_TAG}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Run real server checker
        run: python check_servers.py
        env:
          CONCURRENCY: "15"
          TEST_TIMEOUT: "5"

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: sources.txt

      - name: Commit updated sources.txt to this repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.txt
          git diff --cached --quiet || git commit -m "auto: обновление sources.txt по итогам проверки"
          git push

      # --- Отправка результата в NotZapret | Bypass парсер ---
      # Нужен Personal Access Token с правом записи в тот репозиторий,
      # добавленный в Settings -> Secrets -> Actions как NOTZAPRET_PUSH_TOKEN.
      # NOTZAPRET_REPO — "владелец/репозиторий".
      # NOTZAPRET_SERVERS_DIR — папка внутри того репозитория, куда кладём
      # результат (по умолчанию "servers"); файл внутри неё называем по
      # имени этого репозитория-источника, чтобы несколько чекеров не
      # затирали друг друга.
      - name: Push results into NotZapret | Bypass (servers/ folder)
        if: ${{ vars.NOTZAPRET_REPO != '' }}
        env:
          NOTZAPRET_REPO: ${{ vars.NOTZAPRET_REPO }}
          NOTZAPRET_SERVERS_DIR: ${{ vars.NOTZAPRET_SERVERS_DIR || 'servers' }}
        run: |
          git clone "https://x-access-token:${{ secrets.NOTZAPRET_PUSH_TOKEN }}@github.com/${NOTZAPRET_REPO}.git" target_repo
          mkdir -p "target_repo/${NOTZAPRET_SERVERS_DIR}"
          cp sources.txt "target_repo/${NOTZAPRET_SERVERS_DIR}/sources-checker.txt"
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${NOTZAPRET_SERVERS_DIR}/sources-checker.txt"
          git diff --cached --quiet || git commit -m "auto: конфиги от sources-checker"
          git diff --cached --quiet || git push
